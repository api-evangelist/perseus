note: >-
  Perseus distributes its CLI as a self-hosted PyInstaller binary and a uv-installable wheel served
  from perseus.computer/install (not published to PyPI). It also ships first-party integration
  packages via its GitHub org (efficientsystemsinc). No importable server-side SDK / client library
  is published, so no `SDKs` pointer is emitted — the CLI is the client.
