name: Perseus
description: >-
  Perseus (legal name Efficient Systems Inc.) is an applied AI lab focused on semantic search in
  latent spaces, founded by Samrath Chadha and backed by Y Combinator (Fall 2025 batch). Its first
  product is a retrieval engine that grounds coding agents in real code: developers and agents
  describe the code they are looking for in plain English and Perseus returns ranked file:line
  results with snippets in seconds, indexing the working tree (including uncommitted edits) so
  models like Claude Code, Cursor, and Codex can find the right context before editing. Rather than
  a public REST API, Perseus ships a first-party CLI (installed via a curl/PowerShell one-liner, as
  a PyInstaller binary or uv wheel), a provider-published Agent Skill, and a Factory Droid plugin,
  all under the efficientsystemsinc GitHub organization. The developer surface — docs, console,
  pricing, and blog — is live; there is no OpenAPI, MCP server, or /.well-known discovery document
  published as of this pass.
